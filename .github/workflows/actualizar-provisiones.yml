name: Actualizar datos desde Power Automate

on:
  repository_dispatch:
    types: [actualizar_provisiones]

permissions:
  contents: write

concurrency:
  group: actualizar-provisiones
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
      - name: Transformar datos del Excel
        run: node scripts/import_power_automate.mjs
      - name: Guardar actualización
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/provisiones.json
          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
          else
            git commit -m "Actualizar provisiones desde Excel"
            git push
          fi
