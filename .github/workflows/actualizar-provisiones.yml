name: Actualizar datos desde Power Automate

on:
  repository_dispatch:
    types: [actualizar_provisiones]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar-provisiones
  cancel-in-progress: true

jobs:
  actualizar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
      - name: Transformar datos del Excel
        run: node scripts/import_power_automate.mjs
      - name: Guardar actualización
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/provisiones.json docs/informes
          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
          else
            git commit -m "Actualizar provisiones desde Excel"
            git push
          fi
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Cargar sitio estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Publicar dashboard
        id: deployment
        uses: actions/deploy-pages@v4
