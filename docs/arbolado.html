<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Tablero de arbolado urbano de Maipú Zona 6">
  <title>Arbolado urbano · Maipú Zona 6</title>
  <style>
    :root{--ink:#12271f;--forest:#073e2d;--green:#147a50;--mint:#dff2e7;--lime:#c8e466;--paper:#faf9f4;--muted:#6d7972;--line:#dfe5de;--red:#c54a3d}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}main{width:min(1280px,100%);margin:auto;padding:22px}.intro{display:flex;justify-content:space-between;align-items:end;gap:24px;padding:28px;border-radius:24px;color:#fff;background:linear-gradient(120deg,var(--forest),#166747)}.intro p{max-width:650px;margin:8px 0 0;color:#d6e7dd}.intro h1{margin:0;font:400 clamp(2.4rem,6vw,5.5rem)/.9 Georgia,serif;letter-spacing:-.05em}.actions{display:grid;gap:9px}.actions a{display:block;border-radius:12px;padding:12px 15px;text-align:center;text-decoration:none;font-size:.75rem;font-weight:800}.report{color:var(--ink);background:var(--lime)}.back{color:#fff;border:1px solid #ffffff55}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 0}.metric{display:grid;min-height:132px;padding:18px;border:1px solid var(--line);border-radius:18px;background:#fff}.metric span,.metric small{color:var(--muted);font-size:.67rem}.metric b{align-self:end;font-size:clamp(2rem,4vw,3.5rem);line-height:.85;letter-spacing:-.06em}.metric.primary{color:#fff;background:var(--forest)}.metric.primary b{color:var(--lime)}.metric.primary span,.metric.primary small{color:#cfe0d7}.metric.cut b{color:var(--red)}.metric.planted b{color:var(--green)}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}.panel{padding:22px;border:1px solid var(--line);border-radius:22px;background:#fff}.panel h2{margin:0;font-size:1.35rem}.eyebrow{margin:0 0 7px;color:var(--green);font-size:.66rem;font-weight:850;letter-spacing:.16em}.rows{margin-top:16px}.row{display:grid;grid-template-columns:28px 1fr 70px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid #edf0ec}.row:first-child{border-top:0}.rank{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;color:var(--green);background:var(--mint);font-size:.65rem;font-weight:800}.area{display:grid;grid-template-columns:1fr auto;gap:3px 10px}.area strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.76rem}.area small{color:var(--muted);font-size:.62rem}.bar{grid-column:1/-1;height:6px;border-radius:99px;background:#edf1ed;overflow:hidden}.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--green),var(--lime))}.total{text-align:right}.total b{display:block}.total small{color:var(--muted);font-size:.57rem}.species{margin-top:16px}.species div{display:grid;grid-template-columns:24px 1fr auto;gap:8px;padding:9px 0;border-top:1px solid #edf0ec;font-size:.72rem}.species div:first-child{border-top:0}.species span{color:#186b8f;font-weight:800}.note{padding:12px;border-radius:10px;color:var(--muted);background:#f2f7f9;font-size:.65rem;line-height:1.45}.source{color:var(--muted);font-size:.65rem}.loading{min-height:70vh;display:grid;place-items:center}
    @media(max-width:900px){.metrics{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:650px){main{padding:10px}.intro{align-items:stretch;flex-direction:column}.metrics{grid-template-columns:repeat(2,1fr)}.metric.primary{grid-column:1/-1}}
  </style>
</head>
<body><main id="app"><div class="loading">Preparando catastro de arbolado…</div></main>
<script>
const fmt=new Intl.NumberFormat("es-CL");
fetch("./data/arbolado.json").then(response=>response.json()).then(data=>{
  const max=data.rankingAreas[0]?.totalActual||1;
  document.querySelector("#app").innerHTML=`
  <header class="intro"><div><p class="eyebrow" style="color:var(--lime)">CATASTRO URBANO</p><h1>Arbolado por<br>área verde</h1><p>${data.methodology}</p></div><div class="actions"><a class="report" href="./informe-arbolado-urbano.pdf" download>Descargar informe de arbolado</a><a class="back" href="./index.html">Volver al ecosistema</a></div></header>
  <section class="metrics"><article class="metric primary"><span>Total actualizado</span><b>${fmt.format(data.summary.totalActual)}</b><small>árboles vigentes</small></article><article class="metric"><span>Catastro 2025</span><b>${fmt.format(data.summary.base2025)}</b><small>árboles inventariados</small></article><article class="metric cut"><span>Talas registradas</span><b>−${fmt.format(data.summary.talas)}</b><small>movimientos descontados</small></article><article class="metric planted"><span>Plantaciones</span><b>+${fmt.format(data.summary.plantaciones)}</b><small>movimientos incorporados</small></article><article class="metric"><span>Áreas verdes</span><b>${fmt.format(data.summary.areasVerdes)}</b><small>códigos AB</small></article></section>
  <section class="grid"><article class="panel"><p class="eyebrow">RANKING</p><h2>Áreas verdes con más árboles</h2><div class="rows">${data.rankingAreas.map((area,index)=>`<div class="row"><span class="rank">${index+1}</span><div class="area"><strong>${area.nombre}</strong><small>${area.codigo}</small><span class="bar"><i style="width:${area.totalActual/max*100}%"></i></span></div><div class="total"><b>${fmt.format(area.totalActual)}</b><small>${area.talas?`${area.talas} talas`:"sin talas"}</small></div></div>`).join("")}</div></article><article class="panel"><p class="eyebrow">DIVERSIDAD</p><h2>Especies más frecuentes</h2><div class="species">${data.species.map((species,index)=>`<div><span>${index+1}</span><strong>${species.nombre}</strong><b>${fmt.format(species.cantidadBase2025)}</b></div>`).join("")}</div><p class="note">El detalle por especie corresponde al inventario base 2025. Los movimientos actualizan el total por código AB.</p></article></section>
  <p class="source">Fuente: ${data.source} · Actualizado el ${new Date(data.generatedAt).toLocaleDateString("es-CL")}</p>`;
}).catch(()=>document.querySelector("#app").innerHTML='<div class="loading">No fue posible cargar el catastro.</div>');
</script></body></html>
