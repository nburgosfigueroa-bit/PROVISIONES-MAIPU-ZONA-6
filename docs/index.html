<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Control contractual de provisiones de Maipú Zona 6">
  <title>Control de provisiones · Maipú Zona 6</title>
  <style>
    :root{--ink:#12271f;--forest:#073e2d;--green:#147a50;--mint:#dff2e7;--lime:#c8e466;--paper:#faf9f4;--card:#fff;--muted:#6d7972;--line:#dfe5de;--amber:#d89728;--red:#c54a3d}
    *{box-sizing:border-box}html{background:var(--paper)}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,select,input{font:inherit}main{width:min(1460px,100%);margin:auto;padding:22px 28px 42px}.loading{min-height:80vh;display:grid;place-items:center}
    .hero{position:relative;min-height:500px;overflow:hidden;border-radius:28px;color:#fff;isolation:isolate;box-shadow:0 22px 70px #173c2b22}.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-3}.shade{position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,#032319f2 0%,#032319c7 43%,#0323192e 78%),linear-gradient(0deg,#03191273,transparent 55%)}.heroTop{display:flex;justify-content:space-between;align-items:center;padding:24px 28px;border-bottom:1px solid #ffffff2b}.brand{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:#fffffff0;color:var(--ink)}.brand img{display:block;object-fit:contain}.brand .maipu{width:130px;height:40px}.brand .akro{width:90px;height:34px}.brand span{width:1px;height:34px;background:#cfd8d2}.brand div{display:grid}.brand div small{color:var(--muted);font-size:.62rem}.fresh{color:#dbe7df;font-size:.72rem}.fresh{display:flex;align-items:center;gap:8px}.fresh i{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 5px #c8e46622}.heroCopy{position:absolute;left:clamp(28px,5vw,72px);top:52%;transform:translateY(-44%);max-width:660px}.eyebrow{margin:0 0 8px;color:var(--green);font-size:.67rem;font-weight:850;letter-spacing:.16em}.light{color:var(--lime)}h1{margin:0;font-size:clamp(3.7rem,7vw,7.5rem);line-height:.78;letter-spacing:-.075em}h1 em{font-family:Georgia,serif;font-weight:400;color:var(--lime)}.heroCopy>p:last-child{max-width:570px;margin:28px 0 0;color:#e1e9e4;line-height:1.6}.pdf{position:absolute;right:28px;bottom:28px;width:245px;padding:17px 18px;border-radius:14px;background:#fffffff2;color:var(--ink);text-decoration:none;box-shadow:0 14px 34px #061d1542}.pdf small{display:block;color:var(--muted)}.pdf b{display:block;margin-top:4px}
    .tabs{display:flex;gap:6px;width:max-content;margin:22px 0;padding:5px;border:1px solid var(--line);border-radius:99px;background:#fff}.tabs button{border:0;border-radius:99px;padding:10px 18px;color:var(--muted);background:transparent;font-size:.78rem;font-weight:750;cursor:pointer}.tabs button.active{background:var(--ink);color:#fff}.hidden{display:none!important}
    .toolbar{display:grid;grid-template-columns:minmax(180px,1fr) 105px minmax(180px,1fr) 140px minmax(210px,1.15fr);gap:10px;padding:14px;border:1px solid var(--line);border-radius:18px;background:#fff;align-items:end}.toolbarTitle{display:grid;gap:2px;padding:0 8px 7px}.toolbarTitle span,label{color:var(--muted);font-size:.65rem;font-weight:760}.toolbar label{display:grid;gap:6px}select,input{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#f8f9f6;color:var(--ink)}
    .summary{display:grid;grid-template-columns:1.5fr repeat(3,.72fr);gap:12px;margin:16px 0}.summary article{min-height:165px;border:1px solid var(--line);border-radius:20px;background:#fff}.mainKpi{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;background:#f3f1e9!important}.mainKpi h2,.panelHead h2,.courseHead h2{margin:0;font-size:1.55rem;line-height:1;letter-spacing:-.04em}.mainKpi p:last-child{max-width:290px;color:var(--muted);font-size:.73rem}.ring{width:116px;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;background:conic-gradient(var(--green) var(--progress),#dce2db 0);position:relative}.ring:after{content:"";position:absolute;inset:10px;border-radius:50%;background:#f3f1e9}.ring div{z-index:1;text-align:center}.ring b{display:block;font-size:1.45rem}.ring small{color:var(--muted)}.metric{padding:20px;display:flex;flex-direction:column;justify-content:space-between}.metric>i{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--mint);color:var(--green);font-style:normal;font-weight:900}.metric div{display:grid;grid-template-columns:1fr auto;align-items:end}.metric small,.metric span{color:var(--muted);font-size:.68rem}.metric b{grid-row:1/3;grid-column:2;font-size:2.6rem;line-height:.9}
    .workspace{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(330px,.75fr);gap:16px}.panel,.course,.movements,.technical{border:1px solid var(--line);border-radius:22px;background:#fff;overflow:hidden}.panel,.movements{padding:24px}.panelHead,.courseHead{display:flex;justify-content:space-between;align-items:end;gap:16px}.panelHead>span{padding:6px 10px;border-radius:99px;background:var(--mint);color:var(--green);font-size:.67rem;font-weight:750}.progressList{display:grid;gap:17px;margin:24px 0}.progressItem{display:grid;grid-template-columns:minmax(170px,.9fr) minmax(150px,1.3fr) 42px;gap:16px;align-items:center}.progressItem div:first-child{display:grid;gap:3px}.progressItem strong{font-size:.8rem}.progressItem small{color:var(--muted)}.track{height:9px;border-radius:99px;background:#edf0ec;overflow:hidden}.track i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--green),#89b94f)}.progressItem>b{text-align:right;font-size:.76rem}
    .fieldPhoto{height:150px;margin:8px;overflow:hidden;border-radius:15px;position:relative}.fieldPhoto img{width:100%;height:100%;object-fit:cover}.fieldPhoto span{position:absolute;left:12px;bottom:10px;padding:5px 8px;border-radius:8px;background:#0a241cb8;color:#fff;font-size:.65rem}.courseHead{padding:14px 18px 10px}.courseHead>b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff}.courseList{padding:0 18px}.courseList article{display:grid;grid-template-columns:8px 1fr auto;gap:10px;padding:13px 0;border-top:1px solid var(--line)}.courseList article>i{width:7px;height:7px;margin-top:5px;border-radius:50%;background:var(--amber)}.courseList article div{display:grid;gap:3px}.courseList strong{font-size:.75rem}.courseList small{color:var(--muted);font-size:.64rem}.amount{text-align:right}.movements{margin-top:16px}.tableWrap{overflow:auto;margin-top:16px}table{width:100%;min-width:940px;border-collapse:collapse}th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:.75rem}th{color:var(--muted);font-size:.6rem;letter-spacing:.09em;text-transform:uppercase}td:first-child{display:grid;gap:3px}td:first-child small{color:var(--muted)}.badge{display:inline-flex;border-radius:99px;padding:5px 8px;font-size:.62rem;font-weight:750;white-space:nowrap}.ok{background:var(--mint);color:#155c3d}.open{background:#f8ead4;color:#8b5718}
    .technicalHero{min-height:330px;display:grid;grid-template-columns:1.1fr .9fr;background:var(--ink);color:#fff}.technicalHero img{width:100%;height:100%;object-fit:cover}.technicalHero div{padding:clamp(28px,5vw,64px);display:flex;flex-direction:column;justify-content:center}.technicalHero h2{margin:0;font:400 clamp(2.3rem,4vw,4.3rem)/.95 Georgia,serif}.technicalHero p:not(.eyebrow){color:#cbd9d1;line-height:1.55}.technicalHero a,.docGrid a{color:var(--green);font-weight:750;text-decoration:none}.technicalHero a{color:var(--lime)}.docGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:20px}.docGrid article{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:var(--paper)}.docGrid img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;object-position:top}.docGrid article div{display:grid;gap:6px;padding:15px}.docGrid h3{margin:0}.docGrid span{color:var(--muted);font-size:.7rem}.empty{color:var(--muted);font-size:.75rem}footer{display:flex;justify-content:space-between;gap:20px;padding:24px 4px 0;color:var(--muted);font-size:.66rem}
    @media(max-width:1000px){.toolbar{grid-template-columns:1fr 1fr}.toolbarTitle{grid-column:1/-1}.summary{grid-template-columns:repeat(3,1fr)}.mainKpi{grid-column:1/-1}.workspace{grid-template-columns:1fr}}@media(max-width:700px){main{padding:10px}.hero{min-height:570px}.heroCopy{left:22px;right:22px;top:42%}h1{font-size:18vw}.pdf{left:18px;right:18px;bottom:18px;width:auto}.toolbar,.summary{grid-template-columns:1fr}.mainKpi{grid-column:auto}.progressItem{grid-template-columns:1fr 42px}.track{grid-column:1/-1}.technicalHero,.docGrid{grid-template-columns:1fr}.technicalHero img{height:220px}.docGrid{padding:12px}footer{flex-direction:column}}
  </style>
</head>
<body>
<main id="app"><div class="loading">Preparando provisiones…</div></main>
<script>
const docs=[
 {title:"Césped",section:"3.7.3.9",printed:"21–22",page:22,image:"cesped.webp"},
 {title:"Árboles y arbustos",section:"3.7.4.5",printed:"24–28",page:25,image:"arboles-arbustos.webp"},
 {title:"Florales y semillas",section:"3.7.7.1.5–1.6",printed:"31–34",page:32,image:"florales-semillas.webp"},
 {title:"Cubresuelos",section:"3.7.7.1.1 a 1.5",printed:"31 a 33",page:32,image:"cubresuelos.webp"},
 {title:"Fertilización",section:"3.7.8.1",printed:"35",page:36,image:"fertilizacion.webp"},
 {title:"Riego y PVC",section:"3.8.4.2–4.4",printed:"40–43",page:41,image:"riego-pvc.webp"},
 {title:"Áridos",section:"3.9.2",printed:"45–46",page:46,image:"aridos.webp"}];
const fmt=new Intl.NumberFormat("es-CL",{maximumFractionDigits:1});
const received=s=>/ok|recepcionado/i.test(s);
const clean=s=>s.replaceAll("Cesped","Césped").replaceAll("Arboles","Árboles").replaceAll("Tuberia","Tubería").replaceAll("Valvula","Válvula").replaceAll("hormigon","hormigón");
const date=s=>s?new Date(s).toLocaleDateString("es-CL"):"—";
let data,tab="control";
fetch("./data/provisiones.json").then(r=>r.json()).then(d=>{data=d;render()}).catch(()=>document.querySelector("#app").innerHTML='<div class="loading">No fue posible cargar los datos.</div>');
function render(){
 const year=+(document.querySelector("#year")?.value||2026), status=document.querySelector("#status")?.value||"Todos", category=document.querySelector("#category")?.value||"Todas", query=(document.querySelector("#query")?.value||"").toLowerCase();
 const categories=[...new Set(data.base.map(x=>x.provision))];
 const progress=data.base.filter(x=>x.annual>0).map(x=>{const delivered=data.records.filter(r=>r.contractYear===year&&received(r.status)&&r.category===x.provision&&r.unit.toLowerCase()===x.unit.toLowerCase()).reduce((a,r)=>a+r.quantity,0);return {...x,delivered,pct:Math.min(delivered/x.annual*100,100)}}).sort((a,b)=>b.pct-a.pct);
 const course=data.records.filter(r=>r.contractYear===year&&!received(r.status));
 const complete=progress.filter(x=>x.pct>=100).length, started=progress.filter(x=>x.pct>0&&x.pct<100).length, general=progress.length?complete/progress.length*100:0, overdue=course.filter(x=>x.dueDate&&new Date(x.dueDate)<new Date()).length;
 const movements=data.records.filter(r=>r.contractYear===year&&(status==="Todos"||(status==="Recepcionado"?received(r.status):!received(r.status)))&&(category==="Todas"||r.category===category)&&`${r.provision} ${r.observations}`.toLowerCase().includes(query));
 document.querySelector("#app").innerHTML=`
 <section class="hero"><img src="./assets/contrato/vista-general.jpeg" alt="Vista aérea de áreas verdes de Maipú"><div class="shade"></div><div class="heroTop"><div class="brand"><img class="maipu" src="./assets/marca/municipalidad-maipu.png" alt="Municipalidad de Maipú"><span></span><img class="akro" src="./assets/marca/akro-diseno.png" alt="AKRO Diseño"><div><strong>Contrato Maipú Zona 6</strong><small>Mantención de áreas verdes</small></div></div><div class="fresh"><i></i>Datos actualizados · ${date(data.generatedAt)}</div></div><div class="heroCopy"><p class="eyebrow light">ECOSISTEMA INTERACTIVO · 2025–2030</p><h1>Control de<br><em>provisiones</em></h1><p>Contrato de Maipú Zona 6 para la mantención de áreas verdes: seguimiento de solicitudes, entregas y cumplimiento.</p></div><a class="pdf" href="./assets/base-tecnica/bases-tecnicas-zona-6.pdf" target="_blank"><small>Consultar respaldo</small><b>Ver base técnica →</b></a></section>
 <nav class="tabs"><button data-tab="control" class="${tab==="control"?"active":""}">Panel de control</button><button data-tab="bases" class="${tab==="bases"?"active":""}">Base técnica</button></nav>
 <section id="control" class="${tab==="control"?"":"hidden"}">
  <section class="toolbar"><div class="toolbarTitle"><span>Vista operativa</span><strong>Año contractual ${year}</strong></div><label>Año<select id="year"><option ${year===2026?"selected":""}>2026</option><option ${year===2025?"selected":""}>2025</option></select></label><label>Categoría<select id="category"><option>Todas</option>${categories.map(c=>`<option value="${c}" ${category===c?"selected":""}>${clean(c)}</option>`).join("")}</select></label><label>Estado<select id="status">${["Todos","Recepcionado","En curso"].map(s=>`<option ${status===s?"selected":""}>${s}</option>`).join("")}</select></label><label>Buscar<input id="query" value="${query}" placeholder="Provisión o destino"></label></section>
  <section class="summary"><article class="mainKpi"><div><p class="eyebrow">ESTADO GENERAL</p><h2>Cumplimiento<br>contractual</h2><p>${complete} provisiones completadas de ${progress.length} exigibles durante ${year}.</p></div><div class="ring" style="--progress:${general*3.6}deg"><div><b>${general.toFixed(0)}%</b><small>cumplido</small></div></div></article>${[["✓","Completadas",complete,"100% entregado"],["↗","Con avance",started,"Entrega parcial"],["!","Plazos vencidos",overdue,"Requieren gestión"]].map(x=>`<article class="metric"><i>${x[0]}</i><div><small>${x[1]}</small><b>${x[2]}</b><span>${x[3]}</span></div></article>`).join("")}</section>
  <section class="workspace"><article class="panel"><div class="panelHead"><div><p class="eyebrow">AVANCE ACUMULADO</p><h2>Provisiones con movimiento</h2></div><span>${progress.filter(x=>x.pct>0).length} activas</span></div><div class="progressList">${progress.filter(x=>x.pct>0).slice(0,8).map(x=>`<div class="progressItem"><div><strong>${clean(x.provision)}</strong><small>${fmt.format(x.delivered)} de ${fmt.format(x.annual)} ${x.unit}</small></div><div class="track"><i style="width:${x.pct}%"></i></div><b>${x.pct.toFixed(0)}%</b></div>`).join("")||'<p class="empty">Sin entregas recepcionadas para este año.</p>'}</div></article>
  <aside class="course"><div class="fieldPhoto"><img src="./assets/contrato/area-verde.jpeg" alt="Área verde mantenida"><span>Registro de terreno</span></div><div class="courseHead"><div><p class="eyebrow">ATENCIÓN REQUERIDA</p><h2>Provisiones en curso</h2></div><b>${course.length}</b></div><div class="courseList">${course.map(r=>`<article><i></i><div><strong>${clean(r.provision)}</strong><small>${r.observations||"Sin destino informado"}</small></div><div class="amount"><strong>${fmt.format(r.quantity)} ${r.unit}</strong><small>${r.dueDate?date(r.dueDate):"Sin plazo"}</small></div></article>`).join("")||'<p class="empty">No hay solicitudes abiertas.</p>'}</div></aside></section>
  <section class="movements"><div class="panelHead"><div><p class="eyebrow">TRAZABILIDAD</p><h2>Detalle de movimientos</h2></div><span>${movements.length} registros</span></div><div class="tableWrap"><table><thead><tr><th>Provisión</th><th>Cantidad</th><th>Solicitud</th><th>Plazo</th><th>Estado</th><th>Destino / observación</th></tr></thead><tbody>${movements.map(r=>`<tr><td><strong>${clean(r.provision)}</strong><small>${r.id}</small></td><td>${fmt.format(r.quantity)} ${r.unit}</td><td>${date(r.requestDate)}</td><td>${date(r.dueDate)}</td><td><span class="badge ${received(r.status)?"ok":"open"}">${r.status}</span></td><td>${r.observations||"—"}</td></tr>`).join("")}</tbody></table></div></section>
 </section>
 <section id="bases" class="technical ${tab==="bases"?"":"hidden"}"><div class="technicalHero"><img src="./assets/contrato/parque.jpeg" alt="Parque del contrato"><div><p class="eyebrow light">RESPALDO CONTRACTUAL</p><h2>La base técnica,<br>sin doble lectura.</h2><p>Consulta el texto original, su numeral y la página impresa de cada familia de provisiones.</p><a href="./assets/base-tecnica/bases-tecnicas-zona-6.pdf" target="_blank">Abrir PDF completo →</a></div></div><div class="docGrid">${docs.map(d=>`<article><img src="./assets/base-tecnica/${d.image}" alt="Extracto sobre ${d.title}"><div><p class="eyebrow">NUMERAL ${d.section}</p><h3>${d.title}</h3><span>Páginas impresas ${d.printed}</span><a href="./assets/base-tecnica/bases-tecnicas-zona-6.pdf#page=${d.page}" target="_blank">Ver página exacta →</a></div></article>`).join("")}</div></section>
 <footer><span>Fuente operativa: BI - PROVISIONES.xlsx</span><span>Vista publicada · fotografía de la última actualización.</span></footer>`;
 document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
 ["year","category","status"].forEach(id=>document.querySelector("#"+id)?.addEventListener("change",render));
 document.querySelector("#query")?.addEventListener("input",e=>{const pos=e.target.selectionStart;render();const q=document.querySelector("#query");q.focus();q.setSelectionRange(pos,pos)});
}
</script>
</body>
</html>
