    .summary{display:grid;grid-template-columns:minmax(310px,.72fr) minmax(0,2.28fr);gap:12px;margin:16px 0}.summary article{min-height:165px;border:1px solid var(--line);border-radius:20px;background:#fff}.mainKpi{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;background:#f3f1e9!important}.mainKpi h2,.panelHead h2,.courseHead h2{margin:0;font-size:1.55rem;line-height:1;letter-spacing:-.04em}.mainKpi p:last-child{max-width:290px;color:var(--muted);font-size:.73rem}.ring{width:116px;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;background:conic-gradient(var(--green) var(--progress),#dce2db 0);position:relative}.ring:after{content:"";position:absolute;inset:10px;border-radius:50%;background:#f3f1e9}.ring div{z-index:1;text-align:center}.ring b{display:block;font-size:1.45rem}.ring small{color:var(--muted)}.metric{padding:20px;display:flex;flex-direction:column;justify-content:space-between}.metric>i{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--mint);color:var(--green);font-style:normal;font-weight:900}.metric div{display:grid;grid-template-columns:1fr auto;align-items:end}.metric small,.metric span{color:var(--muted);font-size:.68rem}.metric b{grid-row:1/3;grid-column:2;font-size:2.6rem;line-height:.9}
    .courseAlert{padding:20px 22px;overflow:hidden}.courseAlertHead{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:12px}.courseAlertHead h2{margin:0;font-size:1.42rem;letter-spacing:-.035em}.courseAlertHead>span{padding:6px 10px;border-radius:99px;background:#f8ead4;color:#8b5718;font-size:.67rem;font-weight:760;white-space:nowrap}.courseAlertTable{overflow:auto;max-height:245px;border:1px solid var(--line);border-radius:13px}.courseAlertLabels,.courseAlertRow{display:grid;grid-template-columns:100px minmax(145px,1.15fr) 100px minmax(180px,1.45fr) 125px;gap:12px;align-items:center;min-width:760px}.courseAlertLabels{position:sticky;top:0;z-index:2;padding:9px 12px;background:var(--forest);color:#fff;font-size:.57rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase}.courseAlertRow{padding:11px 12px;border-top:1px solid var(--line);font-size:.69rem}.courseAlertLabels+.courseAlertRow{border-top:0}.courseAlertRow>strong{font-size:.72rem;line-height:1.3}.courseAlertRow>span{color:var(--muted);line-height:1.3}.deliveryAlert{display:inline-flex;justify-content:center;border-radius:99px;padding:6px 8px;font-size:.62rem;white-space:nowrap}.deliveryAlert.onTime{background:var(--mint);color:#155c3d}.deliveryAlert.soon{background:#fff0cf;color:#8b5718}.deliveryAlert.late{background:#f9e2df;color:#a63e34}.deliveryAlert.noDate{background:#edf0ec;color:var(--muted)}

    .fieldPhoto{height:150px;margin:8px;overflow:hidden;border-radius:15px;position:relative}.fieldPhoto img{width:100%;height:100%;object-fit:cover}.fieldPhoto span{position:absolute;left:12px;bottom:10px;padding:5px 8px;border-radius:8px;background:#0a241cb8;color:#fff;font-size:.65rem}.courseHead{padding:14px 18px 10px}.courseHead>b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff}.courseList{padding:0 18px}.courseList article{display:grid;grid-template-columns:8px 1fr auto;gap:10px;padding:13px 0;border-top:1px solid var(--line)}.courseList article>i{width:7px;height:7px;margin-top:5px;border-radius:50%;background:var(--amber)}.courseList article div{display:grid;gap:3px}.courseList strong{font-size:.75rem}.courseList small{color:var(--muted);font-size:.64rem}.amount{text-align:right}.movements{margin-top:16px}.tableWrap{overflow:auto;margin-top:16px}table{width:100%;min-width:940px;border-collapse:collapse}th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:.75rem}th{color:var(--muted);font-size:.6rem;letter-spacing:.09em;text-transform:uppercase}td:first-child{display:grid;gap:3px}td:first-child small{color:var(--muted)}.badge{display:inline-flex;border-radius:99px;padding:5px 8px;font-size:.62rem;font-weight:750;white-space:nowrap}.ok{background:var(--mint);color:#155c3d}.open{background:#f8ead4;color:#8b5718}
    .technicalHero{min-height:330px;display:grid;grid-template-columns:1.1fr .9fr;background:var(--ink);color:#fff}.technicalHero img{width:100%;height:100%;object-fit:cover}.technicalHero div{padding:clamp(28px,5vw,64px);display:flex;flex-direction:column;justify-content:center}.technicalHero h2{margin:0;font:400 clamp(2.3rem,4vw,4.3rem)/.95 Georgia,serif}.technicalHero p:not(.eyebrow){color:#cbd9d1;line-height:1.55}.technicalHero a,.docGrid a{color:var(--green);font-weight:750;text-decoration:none}.technicalHero a{color:var(--lime)}.docGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:20px}.docGrid article{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:var(--paper)}.docGrid img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;object-position:top}.docGrid article div{display:grid;gap:6px;padding:15px}.docGrid h3{margin:0}.docGrid span{color:var(--muted);font-size:.7rem}.empty{color:var(--muted);font-size:.75rem}footer{display:flex;justify-content:space-between;gap:20px;padding:24px 4px 0;color:var(--muted);font-size:.66rem}

    .comparisonGrid{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(0,.82fr);gap:16px}.comparisonCard{height:500px;border:1px solid var(--line);border-radius:22px;background:#fff;overflow:hidden;padding:24px;display:flex;flex-direction:column}.traceCard{border-top:4px solid var(--green)}.baseCard{border-top:4px solid #176b8b}.comparisonTableWrap{margin-top:18px;overflow:auto;min-height:0;flex:1;border:1px solid var(--line);border-radius:14px}.comparisonTable{width:100%;min-width:0;table-layout:fixed;border-collapse:collapse}.comparisonTable th,.comparisonTable td{padding:10px 9px;border-bottom:1px solid var(--line);font-size:.68rem;vertical-align:middle}.comparisonTable th{position:sticky;top:0;z-index:2;background:var(--forest);color:#fff;font-size:.57rem;letter-spacing:.06em;text-transform:uppercase}.baseCard .comparisonTable th{background:#176b8b}.comparisonTable td strong{font-size:.69rem;line-height:1.25}.comparisonTable td small{display:block;margin-top:3px;color:var(--muted);font-size:.57rem}.traceCard .comparisonTable{min-width:820px}.traceCard th:nth-child(1),.traceCard td:nth-child(1){width:10%}.traceCard th:nth-child(2),.traceCard td:nth-child(2){width:11%}.traceCard th:nth-child(3),.traceCard td:nth-child(3){width:7%}.traceCard th:nth-child(4),.traceCard td:nth-child(4){width:9%}.traceCard th:nth-child(5),.traceCard td:nth-child(5){width:10%}.traceCard th:nth-child(6),.traceCard td:nth-child(6){width:26%}.traceCard th:nth-child(7),.traceCard td:nth-child(7){width:13%}.traceCard th:nth-child(8),.traceCard td:nth-child(8){width:14%}.baseCard th:nth-child(1),.baseCard td:nth-child(1){width:34%}.baseCard th:nth-child(2),.baseCard td:nth-child(2),.baseCard th:nth-child(3),.baseCard td:nth-child(3){width:21%}.baseCard th:nth-child(4),.baseCard td:nth-child(4){width:24%}.tableProgress{display:flex;align-items:center;gap:6px}.tableProgress>span{flex:1;height:7px;background:#e2e9e4;border-radius:99px;overflow:hidden}.tableProgress i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#9fc95a)}.tableProgress b{font-size:.62rem;min-width:26px;text-align:right}
    @media(max-width:1000px){.toolbar{grid-template-columns:1fr 1fr}.toolbarTitle{grid-column:1/-1}.summary{grid-template-columns:1fr}.workspace{grid-template-columns:1fr}.comparisonGrid{grid-template-columns:1fr}}@media(max-width:700px){main{padding:10px}.courseAlert{padding:18px}.courseAlertHead{align-items:start}.courseAlertLabels{display:none}.courseAlertTable{max-height:none;overflow:visible;border:0}.courseAlertRow{min-width:0;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:10px;padding:14px;border:1px solid var(--line);border-radius:12px}.courseAlertRow>[data-label]::before{content:attr(data-label);display:block;margin-bottom:3px;color:var(--muted);font-size:.55rem;font-weight:760;letter-spacing:.05em;text-transform:uppercase}.courseAlertRow>[data-label="Lugar de despacho"]{grid-column:1/-1}.hero{min-height:570px}.heroCopy{left:22px;right:22px;top:42%}h1{font-size:18vw}.pdf{left:18px;right:18px;bottom:18px;width:auto}.toolbar,.summary{grid-template-columns:1fr}.mainKpi{grid-column:auto}.progressItem{grid-template-columns:1fr 42px}.track{grid-column:1/-1}.technicalHero,.docGrid{grid-template-columns:1fr}.technicalHero img{height:220px}.docGrid{padding:12px}footer{flex-direction:column}}
  </style>

<body>
<main id="app"><div class="loading">Preparando provisiones…</div></main>
<script>
const docs=[
 {title:"Césped",section:"3.7.3.9",printed:"21–22",page:22,image:"cesped.webp"},
 {title:"Árboles y arbustos",section:"3.7.4.5",printed:"24–28",page:25,image:"arboles-arbustos.webp"},
 {title:"Florales y semillas",section:"3.7.7.1.5–1.6",printed:"31–34",page:32,image:"florales-semillas.webp"},
 {title:"Cubresuelos",section:"3.7.7.1.1 a 1.5",printed:"31 a 33",page:32,image:"cubresuelos.webp"},
 {title:"Fertilización",section:"3.7.8.1",printed:"35",page:36,image:"fertilizacion.webp"},
 {title:"Riego y PVC",section:"3.8.4.2–4.4",printed:"40–43",page:41,image:"riego-pvc.webp"},
 {title:"Áridos",section:"3.9.2",printed:"45–46",page:46,image:"aridos.webp"}];
const fmt=new Intl.NumberFormat("es-CL",{maximumFractionDigits:1});
const received=s=>/ok|recepcionado/i.test(s);
const daysLeft=s=>{if(!s)return null;const [y,m,d]=s.slice(0,10).split("-").map(Number),t=new Date(),today=Date.UTC(t.getFullYear(),t.getMonth(),t.getDate());return Math.ceil((Date.UTC(y,m-1,d)-today)/86400000)};
const deliveryAlert=n=>n===null?{kind:"noDate",text:"Sin fecha informada"}:n<0?{kind:"late",text:`${Math.abs(n)} ${Math.abs(n)===1?"día de atraso":"días de atraso"}`}:n===0?{kind:"late",text:"Vence hoy"}:n<=7?{kind:"soon",text:`${n} ${n===1?"día restante":"días restantes"}`}:{kind:"onTime",text:`${n} días restantes`};
const clean=s=>s.replaceAll("Cesped","Césped").replaceAll("Arboles","Árboles").replaceAll("Tuberia","Tubería").replaceAll("Valvula","Válvula").replaceAll("hormigon","hormigón");
const date=s=>s?new Date(s).toLocaleDateString("es-CL"):"—";
let data,tab="control";
fetch("./data/provisiones.json").then(r=>r.json()).then(d=>{data=d;render()}).catch(()=>document.querySelector("#app").innerHTML='<div class="loading">No fue posible cargar los datos.</div>');
function render(){
 const year=+(document.querySelector("#year")?.value||2026), status=document.querySelector("#status")?.value||"Todos", category=document.querySelector("#category")?.value||"Todas", query=(document.querySelector("#query")?.value||"").toLowerCase();
 const categories=[...new Set(data.base.map(x=>x.provision))];
 const progress=data.base.filter(x=>x.annual>0).map(x=>{const delivered=data.records.filter(r=>r.contractYear===year&&received(r.status)&&r.category===x.provision&&r.unit.toLowerCase()===x.unit.toLowerCase()).reduce((a,r)=>a+r.quantity,0);return {...x,delivered,pct:Math.min(delivered/x.annual*100,100)}}).sort((a,b)=>b.pct-a.pct);
 const course=data.records.filter(r=>r.contractYear===year&&!received(r.status)).map(r=>({...r,days:daysLeft(r.dueDate)})).sort((a,b)=>(a.days??Number.POSITIVE_INFINITY)-(b.days??Number.POSITIVE_INFINITY));
 const complete=progress.filter(x=>x.pct>=100).length, general=progress.length?complete/progress.length*100:0;
 const movements=data.records.filter(r=>r.contractYear===year&&(status==="Todos"||(status==="Recepcionado"?received(r.status):!received(r.status)))&&(category==="Todas"||r.category===category)&&`${r.provision} ${r.observations}`.toLowerCase().includes(query));
 document.querySelector("#app").innerHTML=`
 <section class="hero"><img src="./assets/contrato/vista-general.jpeg" alt="Vista aérea de áreas verdes de Maipú"><div class="shade"></div><div class="heroTop"><div class="brand"><img class="maipu" src="./assets/marca/municipalidad-maipu.png" alt="Municipalidad de Maipú"><span></span><img class="akro" src="./assets/marca/akro-diseno.png" alt="AKRO Diseño"><div><strong>Contrato Maipú Zona 6</strong><small>Mantención de áreas verdes</small></div></div><div class="fresh"><i></i>Datos actualizados · ${date(data.generatedAt)}</div></div><div class="heroCopy"><p class="eyebrow light">ECOSISTEMA INTERACTIVO · 2025–2030</p><h1>Control de<br><em>provisiones</em></h1><p>Contrato de Maipú Zona 6 para la mantención de áreas verdes: seguimiento de solicitudes, entregas y cumplimiento.</p></div><a class="pdf" href="./assets/base-tecnica/bases-tecnicas-zona-6.pdf" target="_blank"><small>Consultar respaldo</small><b>Ver base técnica →</b></a></section>
 <nav class="tabs"><button data-tab="control" class="${tab==="control"?"active":""}">Panel de control</button><button data-tab="bases" class="${tab==="bases"?"active":""}">Base técnica</button></nav>
 <section id="control" class="${tab==="control"?"":"hidden"}">
  <section class="toolbar"><div class="toolbarTitle"><span>Vista operativa</span><strong>Año contractual ${year}</strong></div><label>Año<select id="year"><option ${year===2026?"selected":""}>2026</option><option ${year===2025?"selected":""}>2025</option></select></label><label>Categoría<select id="category"><option>Todas</option>${categories.map(c=>`<option value="${c}" ${category===c?"selected":""}>${clean(c)}</option>`).join("")}</select></label><label>Estado<select id="status">${["Todos","Recepcionado","En curso"].map(s=>`<option ${status===s?"selected":""}>${s}</option>`).join("")}</select></label><label>Buscar<input id="query" value="${query}" placeholder="Provisión o destino"></label></section>
  <section class="summary"><article class="mainKpi"><div><p class="eyebrow">ESTADO GENERAL</p><h2>Cumplimiento<br>contractual</h2><p>${complete} provisiones completadas de ${progress.length} exigibles durante ${year}.</p></div><div class="ring" style="--progress:${general*3.6}deg"><div><b>${general.toFixed(0)}%</b><small>cumplido</small></div></div></article><article class="courseAlert"><div class="courseAlertHead"><div><p class="eyebrow">ALERTA DE ENTREGA</p><h2>Provisiones en curso</h2></div><span>${course.length} ${course.length===1?"entrega pendiente":"entregas pendientes"}</span></div><div class="courseAlertTable" role="table" aria-label="Provisiones en curso"><div class="courseAlertLabels" role="row"><span>Fecha tope</span><span>Provisión</span><span>Cantidad</span><span>Lugar de despacho</span><span>Alerta</span></div>${course.map(r=>{const a=deliveryAlert(r.days);return `<div class="courseAlertRow" role="row"><span data-label="Fecha tope">${r.dueDate?date(r.dueDate):"Sin fecha"}</span><strong data-label="Provisión">${clean(r.provision)}</strong><span data-label="Cantidad">${fmt.format(r.quantity)} ${r.unit}</span><span data-label="Lugar de despacho">${r.observations||"Sin destino informado"}</span><b class="deliveryAlert ${a.kind}" data-label="Alerta">${a.text}</b></div>`}).join("")||'<p class="empty">No hay provisiones en curso para este año.</p>'}</div></article></section>  <section class="comparisonGrid"><article class="comparisonCard traceCard"><div class="panelHead"><div><p class="eyebrow">TRAZABILIDAD</p><h2>Entrega de provisiones</h2></div><span>${movements.length} registros</span></div><div class="comparisonTableWrap"><table class="comparisonTable"><thead><tr><th>Solicitud</th><th>Manifold del mes</th><th>Hoja</th><th>Orden de servicio</th><th>Plazo</th><th>Provisión</th><th>Cantidad</th><th>Estado</th></tr></thead><tbody>${movements.map(r=>`<tr><td>${r.requestDate?date(r.requestDate):"Sin fecha"}</td><td>${r.manifoldMonth||"Sin mes"}</td><td>${r.bookSheet||"—"}</td><td>${r.serviceOrder?`N° ${r.serviceOrder}`:"—"}</td><td>${r.dueDate?date(r.dueDate):"Sin fecha"}</td><td><strong>${clean(r.provision)}</strong><small>${r.observations||"Sin destino informado"}</small></td><td>${fmt.format(r.quantity)} ${r.unit}</td><td><span class="badge ${received(r.status)?"ok":"open"}">${received(r.status)?"Recepcionado":"En curso"}</span></td></tr>`).join("")}</tbody></table></div></article><article class="comparisonCard baseCard"><div class="panelHead"><div><p class="eyebrow">BASE TÉCNICA</p><h2>Compromiso contractual</h2></div><span>${progress.length} provisiones</span></div><div class="comparisonTableWrap"><table class="comparisonTable"><thead><tr><th>Provisión</th><th>Total base</th><th>Entregado</th><th>Avance</th></tr></thead><tbody>${progress.map(x=>`<tr><td><strong>${clean(x.provision)}</strong></td><td>${fmt.format(x.annual)} ${x.unit}</td><td>${fmt.format(x.delivered)} ${x.unit}</td><td><div class="tableProgress"><span><i style="width:${x.pct}%"></i></span><b>${x.pct.toFixed(0)}%</b></div></td></tr>`).join("")}</tbody></table></div></article></section>
 </section>
 <section id="bases" class="technical ${tab==="bases"?"":"hidden"}"><div class="technicalHero"><img src="./assets/contrato/parque.jpeg" alt="Parque del contrato"><div><p class="eyebrow light">RESPALDO CONTRACTUAL</p><h2>La base técnica,<br>sin doble lectura.</h2><p>Consulta el texto original, su numeral y la página impresa de cada familia de provisiones.</p><a href="./assets/base-tecnica/bases-tecnicas-zona-6.pdf" target="_blank">Abrir PDF completo →</a></div></div><div class="docGrid">${docs.map(d=>`<article><img src="./assets/base-tecnica/${d.image}" alt="Extracto sobre ${d.title}"><div><p class="eyebrow">NUMERAL ${d.section}</p><h3>${d.title}</h3><span>Páginas impresas ${d.printed}</span><a href="./assets/base-tecnica/bases-tecnicas-zona-6.pdf#page=${d.page}" target="_blank">Ver página exacta →</a></div></article>`).join("")}</div></section>
